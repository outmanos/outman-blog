</main>

<footer class="site-footer">

  {{- with .Site.Params.github }}
  <a href="{{ . }}" target="_blank" rel="noopener" class="link-icon">
    <img src="/img/github.svg" alt="GitHub" title="My GitHub account">
  </a>
  {{- end }}

  {{- with .Site.Params.stackoverflow }}
  <a href="{{ . }}" target="_blank" rel="noopener" class="link-icon">
    <img src="/img/stackoverflow.svg" alt="StackOverflow" title="My StackOverflow">
  </a>
  {{- end }}

  {{- with .Site.Params.linkedin }}
  <a href="{{ . }}" target="_blank" rel="noopener" class="link-icon">
    <img src="/img/linkedin.svg" alt="LinkedIn" title="My LinkedIn. Hire me!">
  </a>
  {{- end }}

  <!-- <a href="{{- with .Site.Params.contact }}{{ . }}{{ end -}}" target="_blank" class="link-icon">
    <img src="/img/gmail.svg" alt="LinkedIn" title="Contact me!">
  </a> -->

  <a href="/index.xml"  target="_blank" class="link-icon">
    <img src="/img/rss.svg" alt="RSS Feed" title="Subscribe to my RSS Feed">
  </a>

  <p>
    &copy; {{ dateFormat "2006" now }} {{ .Site.Title }}
  </p>

</footer>

<script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", user => {
      if (!user) {
        window.netlifyIdentity.on("login", () => {
          document.location.href = "/admin/";
        });
      }
    });
  }
</script>

</body>

</html>
