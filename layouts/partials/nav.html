<header class="site-header">
  <nav class="site-nav">
    <a class="logo" href="/">
      {{ .Site.Title }}
    </a>
    <ul class="main-menu">
      {{ range .Site.Menus.main }}
      <li>
        <a href="{{ .URL }}">{{ .Name }}</a>
      </li>
      {{ end }}
    </ul>
    {{- with .Site.Params.portfolio }}
    <a class="portfolio" href="{{ . }}" target="_blank" rel="noopener">
      Portfolio
    </a>
    {{- end }}
  </nav>
</header>
