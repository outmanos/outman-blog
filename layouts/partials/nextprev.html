{{ if or .PrevInSection .NextInSection -}}
<nav class="post-nav">
    {{- with .PrevInSection }}
    <a href="{{ .RelPermalink }}" class="previous-post">&#60; {{ .Title }}</a>
    {{- end }}
    {{- with .NextInSection }}
    <a href="{{ .RelPermalink }}" class="next-post">{{ .Title }} &#62;</a>
    {{- end }}
</nav>
{{ end -}}
